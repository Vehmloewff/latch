name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        run: go test ./...

      - name: Run Go cross-language integration tests
        run: go run ./integration_test go

  dart:
    name: Dart tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Go for integration tests
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install binary runtime dependencies
        working-directory: codegen/dart/binary_runtime
        run: dart pub get

      - name: Run binary runtime tests
        working-directory: codegen/dart/binary_runtime
        run: dart test

      - name: Install chat app dependencies
        working-directory: chat_app_example/dart
        run: dart pub get

      - name: Analyze chat app
        working-directory: chat_app_example/dart
        run: dart analyze lib main.dart test

      - name: Run chat app tests
        working-directory: chat_app_example/dart
        run: dart test

      - name: Run Dart cross-language integration tests
        run: go run ./integration_test dart

  swift:
    name: Swift client tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint and Swift package tests
        run: go run ./integration_test swift

  kotlin:
    name: Kotlin client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo /tmp/kotlin/kotlinc/bin >> "$GITHUB_PATH"
      - name: Run Kotlin binary and socket tests
        run: go test ./codegen/kotlin -count=1 -v
      - name: Run Kotlin integration tests
        run: go run ./integration_test kotlin

  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            codegen/typescript/binary_runtime/package-lock.json
            chat_app_example/typescript/package-lock.json

      - name: Set up Go for integration tests
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install binary runtime dependencies
        working-directory: codegen/typescript/binary_runtime
        run: npm ci

      - name: Run binary runtime tests
        working-directory: codegen/typescript/binary_runtime
        run: npm test

      - name: Install chat app dependencies
        working-directory: chat_app_example/typescript
        run: npm ci

      - name: Run chat app type checks
        working-directory: chat_app_example/typescript
        run: npm run check

      - name: Run chat app tests
        working-directory: chat_app_example/typescript
        run: npm test

      - name: Run Node cross-language integration tests
        run: go run ./integration_test typescript
