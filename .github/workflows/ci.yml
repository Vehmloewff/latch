name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        run: go test ./...

      - name: Run Go cross-language integration tests
        run: go run ./integration_test go

  dart:
    name: Dart tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Go for integration tests
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Dart binary, analysis, and integration tests
        run: go run ./integration_test dart

  swift:
    name: Swift client tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint and Swift package tests
        run: go run ./integration_test swift

  kotlin:
    name: Kotlin client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo /tmp/kotlin/kotlinc/bin >> "$GITHUB_PATH"
      - name: Run Kotlin binary, socket, and integration tests
        run: go run ./integration_test kotlin

  csharp:
    name: C# client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run generated C# binary and WebSocket tests
        run: go test ./codegen/csharp -count=1 -v

  rust:
    name: Rust client tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Rust client dependencies
        run: cargo fetch --locked --manifest-path chat_app_example/rust/Cargo.toml

      - name: Test generated Rust clients and wire codec
        env:
          LATCH_RUST_REQUIRE: '1'
        run: go test ./codegen/rust -count=1 -v

      - name: Run Rust lifecycle and live Go server integration tests
        run: go run ./integration_test rust

  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            codegen/typescript/binary_runtime/package-lock.json
            chat_app_example/typescript/package-lock.json

      - name: Set up Go for integration tests
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Node binary, type-check, and integration tests
        run: go run ./integration_test typescript
